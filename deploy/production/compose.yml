services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: wtm
      POSTGRES_USER: wtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wtm -d wtm']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - wtm_postgres_data:/var/lib/postgresql
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    image: ${WTM_IMAGE:?WTM_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_ORIGIN: https://whatthemake.ru
      LOG_LEVEL: info
      DATABASE_URL: postgresql://wtm:${POSTGRES_PASSWORD}@postgres:5432/wtm
      DATABASE_POOL_MAX: 10
      MIGRATIONS_DIR: /app/apps/server/migrations
      WEB_ROOT: /app/apps/web/dist
      MEDIA_ROOT: /var/lib/whatthemake/media
      MEDIA_MAX_BYTES: 8388608
      MEDIA_UPLOAD_RECOVERY_DELAY_MS: 60000
      MEDIA_RECOVERY_POLL_MS: 1000
      MEDIA_RECOVERY_LEASE_MS: 30000
      MEDIA_RECOVERY_RETRY_BASE_MS: 5000
      MEDIA_RECOVERY_RETRY_MAX_MS: 3600000
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8790:8787'
    networks:
      - backend
      - edge
    read_only: true
    volumes:
      - wtm_media_data:/var/lib/whatthemake/media
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  backend:
    internal: true
  edge:

volumes:
  wtm_postgres_data:
  wtm_media_data:
