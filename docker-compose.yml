services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: wtm
      POSTGRES_USER: wtm
      POSTGRES_PASSWORD: wtm
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wtm -d wtm']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - wtm_postgres_data:/var/lib/postgresql

  web:
    build:
      context: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_ORIGIN: http://127.0.0.1:8787
      LOG_LEVEL: info
      DATABASE_URL: postgresql://wtm:wtm@postgres:5432/wtm
      DATABASE_POOL_MAX: 10
      MIGRATIONS_DIR: /app/apps/server/migrations
      WEB_ROOT: /app/apps/web/dist
      MEDIA_ROOT: /var/lib/whatthemake/media
      MEDIA_MAX_BYTES: 8388608
      MEDIA_UPLOAD_RECOVERY_DELAY_MS: 60000
      MEDIA_RECOVERY_POLL_MS: 1000
      MEDIA_RECOVERY_LEASE_MS: 30000
      MEDIA_RECOVERY_RETRY_BASE_MS: 5000
      MEDIA_RECOVERY_RETRY_MAX_MS: 3600000
      BUILD_SHA: local-compose
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8787:8787'
    init: true
    volumes:
      - wtm_media_data:/var/lib/whatthemake/media

volumes:
  wtm_postgres_data:
  wtm_media_data:
