name: Encrypt provider secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_API: ${{ secrets.GOOGLE_API }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
    steps:
      - name: Check out the public encryption key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate and encrypt secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          [[ "$GOOGLE_API" == AIza* ]]
          [[ "$DEEPSEEK_API" == sk-* ]]

          public_key_fingerprint="$(
            openssl pkey \
              -pubin \
              -in .github/provider-secrets-public.pem \
              -outform DER \
              | sha256sum \
              | cut -d ' ' -f 1
          )"
          test "$public_key_fingerprint" = \
            "600e2d030d573d2d2bbdd34a6f3f441e432b830ba568739d8485a1fb096a34fc"

          payload="$(mktemp)"
          cleanup() {
            shred -u "$payload" 2>/dev/null || rm -f "$payload"
          }
          trap cleanup EXIT

          printf \
            'GOOGLE_VISION_API_KEY=%s\nDEEPSEEK_API_KEY=%s\n' \
            "$GOOGLE_API" \
            "$DEEPSEEK_API" \
            > "$payload"

          openssl pkeyutl \
            -encrypt \
            -pubin \
            -inkey .github/provider-secrets-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in "$payload" \
            -out provider-secrets.env.enc

          test -s provider-secrets.env.enc

      - name: Upload encrypted payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-secrets-${{ github.run_id }}
          path: provider-secrets.env.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
