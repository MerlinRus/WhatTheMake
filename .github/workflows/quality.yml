name: Production quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify contracts, types, style, benchmark and unit tests
        run: docker build --target verification -t whatthemake-verification:ci .
      - name: Integration against disposable database
        run: sh deploy/production/verify-isolated.sh whatthemake-verification:ci
      - name: Audit production dependencies
        run: docker run --rm whatthemake-verification:ci npm audit --omit=dev --audit-level=high
      - name: Build browser test environment
        run: docker build --target e2e -t whatthemake-e2e:ci .
      - name: Browser checks against isolated application
        run: |
          sudo mkdir -p /srv/whatthemake/work/ci
          sudo chown "$(id -u):$(id -g)" /srv/whatthemake/work/ci
          git archive HEAD | tar -x -C /srv/whatthemake/work/ci
          sh deploy/production/verify-browser.sh whatthemake-verification:ci /srv/whatthemake/work/ci whatthemake-e2e:ci
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-evidence
          path: /srv/whatthemake/work/ci/test-results
          retention-days: 7
          if-no-files-found: ignore
